<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Dashboard | Yadav Web Technologies</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        /* Page loader – full screen spinner */
        #pageLoader {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--admin-bg);
            z-index: 9999;
        }
        #pageLoader .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #e2e8f0;
            border-top: 5px solid var(--admin-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Hide login/dashboard until auth decides */
        #loginScreen, #dashboard {
            display: none !important;
        }
        #loginScreen.visible, #dashboard.visible {
            display: flex !important;
        }
        #dashboard.visible {
            display: grid !important;
        }
    </style>
</head>

<body>

    <!-- PAGE LOADER (visible until auth check) -->
    <div id="pageLoader"><div class="spinner"></div></div>

    <!-- ===== LOGIN ===== -->
    <section id="loginScreen">
        <div class="login-card">
            <div class="login-brand">
                <span class="login-brand-mark">Y</span>
                <span>Yadav Web Technologies</span>
            </div>
            <h1>Admin Login</h1>
            <p>Sign in to securely manage appointment requests.</p>
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" autocomplete="current-password" required>
                </div>
                <button type="submit" class="login-button">Sign In</button>
                <div id="loginError" role="alert"></div>
            </form>
        </div>
    </section>

    <!-- ===== DASHBOARD ===== -->
    <section id="dashboard">
        <!-- SIDEBAR -->
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="admin-logo">
                <span class="admin-logo-mark">Y</span>
                <span>Admin Panel</span>
            </div>
            <nav class="admin-nav">
                <button type="button" id="dashboardNav" class="active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <rect x="4" y="4" width="6" height="6" rx="1"></rect>
                        <rect x="14" y="4" width="6" height="6" rx="1"></rect>
                        <rect x="4" y="14" width="6" height="6" rx="1"></rect>
                        <rect x="14" y="14" width="6" height="6" rx="1"></rect>
                    </svg>
                    Dashboard
                </button>
                <button type="button" id="appointmentsNav">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <rect x="4" y="5" width="16" height="15" rx="2"></rect>
                        <path d="M8 3v4"></path><path d="M16 3v4"></path><path d="M4 10h16"></path>
                    </svg>
                    Appointments
                </button>
            </nav>
        </aside>

        <!-- MAIN -->
        <main class="admin-main">
            <div class="admin-topbar">
                <button type="button" id="mobileMenuButton" aria-label="Open admin menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                        <path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path>
                    </svg>
                </button>
                <div class="admin-heading">
                    <h1>Appointment Dashboard</h1>
                    <p>Manage and review your appointment requests.</p>
                </div>
                <div class="admin-actions">
                    <span class="admin-user" id="adminUser"></span>
                    <button type="button" class="admin-button" id="refreshButton">Refresh</button>
                    <button type="button" class="admin-button danger" id="logoutButton">Sign Out</button>
                </div>
            </div>

            <!-- STATISTICS -->
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-label">Total</div><div class="stat-number" id="totalCount">0</div></div>
                <div class="stat-card"><div class="stat-label">New</div><div class="stat-number" id="newCount">0</div></div>
                <div class="stat-card"><div class="stat-label">Contacted</div><div class="stat-number" id="contactedCount">0</div></div>
                <div class="stat-card"><div class="stat-label">Confirmed</div><div class="stat-number" id="confirmedCount">0</div></div>
                <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-number" id="completedCount">0</div></div>
            </div>

            <!-- APPOINTMENTS PANEL -->
            <section class="admin-panel" id="appointmentsPanel">
                <div class="panel-header">
                    <div>
                        <h2>Appointments</h2>
                        <p>Review all appointment requests.</p>
                    </div>
                </div>
                <div class="filters">
                    <input type="search" id="searchInput" placeholder="Search by name, email, phone or service..." autocomplete="off">
                    <select id="statusFilter">
                        <option value="all">All Statuses</option>
                        <option value="new">New</option>
                        <option value="contacted">Contacted</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <!-- Appointment list container -->
                <div id="appointmentsList">
                    <div class="loading-spinner" id="listSpinner">
                        <div class="spinner"></div>
                    </div>
                </div>
            </section>
        </main>
    </section>

    <!-- ===== TOAST ===== -->
    <div id="adminToast" class="admin-toast" role="status" aria-live="polite">
        <span id="toastTitle"></span>
        <span id="toastMessage"></span>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
